name: CompulsaObra CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verify:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint Backend (Ruff)
        working-directory: backend
        run: |
          python -m ruff check .

      - name: Run Backend Pytest (E2E-01 to E2E-05 & Audit Regressions)
        working-directory: backend
        run: |
          python -m pytest -v

  postgres-redis-integration:
    name: PostgreSQL 16 + Alembic & Redis Integration (H-34, H-36)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compulsa_test
          POSTGRES_PASSWORD: StrongTestPass2026
          POSTGRES_DB: compulsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U compulsa_test -d compulsa_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run PostgreSQL 16 + Alembic & Redis Rate Limiter Test
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql://compulsa_test:StrongTestPass2026@127.0.0.1:5432/compulsa_test
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python -m pytest tests/test_postgres_integration.py -v

  frontend-verify:
    name: Frontend Typecheck, Build & Playwright E2E (H-35)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12 for E2E backend server
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck TypeScript (Zero any, strict mode)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production Vite Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Full-Stack E2E Tests
        working-directory: frontend
        run: npm run test:e2e
