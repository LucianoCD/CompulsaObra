name: CompulsaObra CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verify:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install xlrd>=2.0.1

      - name: Run Backend Pytest (E2E-01 to E2E-05 & Audit Regressions)
        working-directory: backend
        run: |
          pytest -v

  frontend-verify:
    name: Frontend Strict TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck TypeScript (Zero any, strict mode)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production Vite Build
        working-directory: frontend
        run: npm run build
