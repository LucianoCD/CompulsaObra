services:
  db:
    image: postgres:16-alpine
    container_name: compulsa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compulsa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD antes de iniciar en produccion}
      POSTGRES_DB: ${POSTGRES_DB:-compulsa_obra}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compulsa_user} -d ${POSTGRES_DB:-compulsa_obra}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: compulsa_redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: compulsa_mailpit
    profiles: ["dev", "development", "test"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    expose:
      - "1025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compulsa_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-compulsa_user}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-compulsa_obra}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY segura antes de iniciar}
      HMAC_SHARE_SECRET: ${HMAC_SHARE_SECRET:?Defina HMAC_SHARE_SECRET segura antes de iniciar}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      SMTP_HOST: ${SMTP_HOST:?Defina un proveedor SMTP real en SMTP_HOST antes de iniciar en produccion}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Defina un remitente valido en SMTP_FROM_EMAIL antes de iniciar en produccion}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?Defina una URL publica HTTPS en FRONTEND_PUBLIC_URL antes de iniciar en produccion}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compulsa_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
