services:
  db:
    image: postgres:16-alpine
    container_name: compulsa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compulsa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compulsa_pass}
      POSTGRES_DB: ${POSTGRES_DB:-compulsa_obra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compulsa_user} -d ${POSTGRES_DB:-compulsa_obra}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compulsa_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-compulsa_user}:${POSTGRES_PASSWORD:-compulsa_pass}@db:5432/${POSTGRES_DB:-compulsa_obra}
      SECRET_KEY: ${SECRET_KEY:-compulsa_super_secret_jwt_key_2026_noa}
      HMAC_SHARE_SECRET: ${HMAC_SHARE_SECRET:-compulsa_hmac_share_secret_2026_noa}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compulsa_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
